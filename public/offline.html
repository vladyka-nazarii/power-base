<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>PowerBase offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #09090b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #09090b;
          color: #fafafa;
        }
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100vw - 2rem));
      }

      img {
        width: 4rem;
        height: 4rem;
      }

      h1 {
        margin: 1.5rem 0 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1;
      }

      p {
        margin: 1rem 0 0;
        color: color-mix(in oklch, currentcolor, transparent 35%);
        font-size: 1rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.5rem;
        margin-top: 1.5rem;
        border: 1px solid color-mix(in oklch, currentcolor, transparent 80%);
        border-radius: 0.5rem;
        padding: 0 1rem;
        color: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/powerbase-icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>
        PowerBase cannot reach the network right now. Reconnect and reload to
        continue comparing equipment.
      </p>
      <a href="/en">Try PowerBase again</a>
    </main>
  </body>
</html>
